name: Test Frontend

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Test adaptive request wiring
        run: CI=true npm test -- --runInBand src/__tests__/services/questionBankAgentService.test.js

      - name: Build production frontend
        run: npm run build
