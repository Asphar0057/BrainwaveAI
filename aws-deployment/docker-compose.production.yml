version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../aws-deployment/Dockerfile.production
    container_name: brainwave-backend-prod
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env.production
    environment:
      - BACKEND_ID=ec2-production
      - ENVIRONMENT=production
      - UPLOAD_DIR=/app/uploads
      - PYTHONUNBUFFERED=1
    volumes:
      - ../backend:/app
      - backend_uploads:/app/uploads
      - backend_exports:/app/exports
      - backend_attachments:/app/attachments
      - backend_chroma:/app/chroma_db
      - backend_cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_uploads:
  backend_exports:
  backend_attachments:
  backend_chroma:
  backend_cache:
